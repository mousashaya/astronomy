[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desc-demo"
version = "0.1.0"
description = "LSST DESC demo: weak lensing (DES DR1) + SN Ia Hubble diagram (Fink/ZTF), dark matter and dark energy"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
